<div class="grid grid-cols-5 items-center">
  @if (config().rightIcon) {
    <div class="col-span-1">
      <app-button
        class="size-10"
        [config]="{ variant: 'link', mode: 'iconOnly' }"
        (buttonClicked)="rightIconClicked.emit()"
      >
      </app-button>
    </div>
  }

  <p class="col-span-3 flex items-center justify-center">
    {{ config().title }}
  </p>

  @if (config().leftIcon) {
    <div class="col-span-1"></div>
  }
</div>
