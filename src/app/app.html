<div
  class="flex h-dvh w-full min-w-0 max-w-full flex-col overflow-hidden bg-[#F7F9FA] text-[#202325]"
>

    class="scrollbar-none min-h-0 w-full min-w-0 max-w-full flex-1 overflow-y-auto overflow-x-hidden"
  >

  }
