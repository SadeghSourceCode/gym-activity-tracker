<section class="flex w-full min-w-0 flex-col gap-5">
  <div>
    <h1 class="text-2xl font-bold text-[#202325]">{{ i18n.t('profile') }}</h1>
    <p class="text-sm text-[#72777A]">{{ i18n.t('systemTheme') }} / {{ i18n.t('language') }}</p>
  </div>

  <div class="rounded-3xl bg-white p-4 shadow-sm">
    <label class="flex flex-col items-center gap-3 text-center">
      <span class="text-sm font-semibold text-[#72777A]">{{ i18n.t('profileImage') }}</span>

      @if (profile().imageBase64) {
        <img
          class="size-28 rounded-full border border-[#E3E5E5] object-cover"
          [src]="profile().imageBase64"
          alt=""
        />
      } @else {
        <span class="flex size-28 items-center justify-center rounded-full bg-[#F7F9FA] text-4xl text-[#979C9E]">
          👤
        </span>
      }

      <span class="rounded-full bg-[#0070F0] px-4 py-2 text-sm font-semibold text-white">
        {{ i18n.t('uploadImage') }}
      </span>

      <input
        class="sr-only"
        type="file"
        accept="image/*"
        (change)="uploadProfileImage($event)"
      />
    </label>
  </div>

  <form class="grid gap-4 rounded-3xl bg-white p-4 shadow-sm">
    <label class="block text-sm font-medium text-[#72777A]">
      {{ i18n.t('userName') }}
      <input
        class="mt-1 block w-full rounded-xl border border-[#E3E5E5] bg-[#F7F9FA] px-4 py-3 text-[#202325] focus:outline-none focus:ring-2 focus:ring-[#0070F0]"
        type="text"
        [value]="profile().name"
        (input)="updateName($any($event.target).value)"
      />
    </label>

    <label class="block text-sm font-medium text-[#72777A]">
      {{ i18n.t('birthday') }}
      <input
        class="mt-1 block w-full rounded-xl border border-[#E3E5E5] bg-[#F7F9FA] px-4 py-3 text-[#202325] focus:outline-none focus:ring-2 focus:ring-[#0070F0]"
        type="date"
        [value]="profile().birthday"
        (input)="updateBirthday($any($event.target).value)"
      />
    </label>

    <div class="grid grid-cols-2 gap-3">
      <label class="block min-w-0 text-sm font-medium text-[#72777A]">
        {{ i18n.t('tall') }}
        <input
          class="mt-1 block w-full rounded-xl border border-[#E3E5E5] bg-[#F7F9FA] px-4 py-3 text-[#202325] focus:outline-none focus:ring-2 focus:ring-[#0070F0]"
          type="number"
          min="0"
          inputmode="decimal"
          [value]="profile().tall ?? ''"
          (input)="updateTall($any($event.target).value)"
        />
      </label>

      <label class="block min-w-0 text-sm font-medium text-[#72777A]">
        {{ i18n.t('weight') }}
        <input
          class="mt-1 block w-full rounded-xl border border-[#E3E5E5] bg-[#F7F9FA] px-4 py-3 text-[#202325] focus:outline-none focus:ring-2 focus:ring-[#0070F0]"
          type="number"
          min="0"
          inputmode="decimal"
          [value]="profile().weight ?? ''"
          (input)="updateWeight($any($event.target).value)"
        />
      </label>
    </div>

    <label class="block text-sm font-medium text-[#72777A]">
      {{ i18n.t('systemTheme') }}
      <select
        class="mt-1 block w-full rounded-xl border border-[#E3E5E5] bg-[#F7F9FA] px-4 py-3 text-[#202325] focus:outline-none focus:ring-2 focus:ring-[#0070F0]"
        [value]="profile().theme"
        (change)="updateTheme($any($event.target).value)"
      >
        <option value="system">{{ getThemeLabel('system') }}</option>
        <option value="light">{{ getThemeLabel('light') }}</option>
        <option value="dark">{{ getThemeLabel('dark') }}</option>
      </select>
    </label>

    <label class="block text-sm font-medium text-[#72777A]">
      {{ i18n.t('language') }}
      <select
        class="mt-1 block w-full rounded-xl border border-[#E3E5E5] bg-[#F7F9FA] px-4 py-3 text-[#202325] focus:outline-none focus:ring-2 focus:ring-[#0070F0]"
        [value]="profile().language"
        (change)="updateLanguage($any($event.target).value)"
      >
        <option value="en">{{ getLanguageLabel('en') }}</option>
        <option value="fa">{{ getLanguageLabel('fa') }}</option>
      </select>
    </label>
  </form>
</section>
