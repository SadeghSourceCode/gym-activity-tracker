<div class="flex w-full min-w-0 max-w-full flex-col overflow-hidden">
  <div class="flex w-full min-w-0 max-w-full flex-col gap-4 overflow-hidden rounded-2xl">
    <app-workout-calendar
      [selectedDate]="selectedDate()"
      [workouts]="workouts()"
      (dateSelected)="selectDate($event)"
    />

    <app-selected-day-panel
      [text]="selectedDayPanelText()"
      [selectedDateLabel]="selectedDateLabel()"
      [selectedDayViewModel]="selectedDayViewModel()"
      [selectedDayWorkoutStatus]="selectedDayWorkoutStatus()"
      [selectedDayError]="selectedDayError()"
      (retry)="retrySelectedDay()"
      (openWorkoutDetails)="openWorkoutDetails($event)"
      (rejectWorkout)="setWorkoutCompletionStatus(+$event, 'rejected')"
      (editWorkout)="openEditWorkoutSheet($event)"
      (deleteWorkout)="removeWorkout(+$event)"
      (copyWorkout)="copyWorkout($event)"
      (setWorkout)="openExerciseSheet()"
      (markAsRestDay)="markSelectedDayAsRestDay()"
      (removeRestDay)="removeSelectedRestDay()"
    />

    <app-workout-overview [config]="workoutOverviewConfig()" />

    <app-daily-progress [config]="dailyProgressConfig()" />

    <app-weekly-calories [config]="weeklyCaloriesConfig()" />


  </div>
</div>

@if (exerciseDetailsError()) {
  <p class="mt-4 rounded-xl bg-[#FFD6D6] p-3 text-center text-[#FF6D6D]">
    {{ exerciseDetailsError() }}
  </p>
}

@if (selectedExercise(); as exercise) {
  <app-exercise-details-dialog
    [text]="exerciseDetailsText()"
    [exercise]="exercise"
    [similarExercises]="similarExercises()"
    [imageBaseUrl]="exerciseImageBaseUrl"
    (close)="closeExerciseDetails()"
    (showExercise)="showExerciseDetails($event)"
  />
}
