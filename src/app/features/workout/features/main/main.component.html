<div class="flex w-full min-w-0 max-w-full flex-col overflow-hidden">
  <div class="mt-4 flex w-full min-w-0 max-w-full flex-col gap-4 overflow-hidden rounded-2xl">
    @for (workout of workouts(); track workout.id; let last = $last) {
      <div class="flex w-full min-w-0 max-w-full flex-col gap-4 overflow-hidden p-3 bg-gray-100">
        <label class="block min-w-0">
          Workout name
          <input
            class="block w-full min-w-0 max-w-full"
            type="text"
            [value]="workout.name"
            (input)="updateWorkoutName(workout.id, $any($event.target).value)"
          />
        </label>

        <div class="flex w-full min-w-0 max-w-full flex-col gap-2 overflow-hidden">
          @for (set of workout.sets; track set.id) {
            <div
              class="grid w-full min-w-0 max-w-full grid-cols-2 items-center gap-4 overflow-hidden"
            >
              <label class="block min-w-0">
                Repeat
                <input
                  class="block w-full min-w-0 max-w-full"
                  type="number"
                  min="0"
                  [value]="set.repeat"
                  (input)="updateSet(workout.id, set.id, { repeat: +$any($event.target).value })"
                />
              </label>

              <label class="block min-w-0">
                Weight
                <input
                  class="block w-full min-w-0 max-w-full"
                  type="number"
                  min="0"
                  [value]="set.weight"
                  (input)="updateSet(workout.id, set.id, { weight: +$any($event.target).value })"
                />
              </label>
            </div>
          }
        </div>
        <button
          class="w-full rounded-full bg-blue-900 text-white"
          type="button"
          (click)="addSet(workout.id)"
        >
          Add new set
        </button>
      </div>

      @if (!last) {
        <hr />
      }
    }

    <button
      class="w-full rounded-full bg-green-700 px-4 py-2 text-white"
      type="button"
      (click)="addWorkout()"
    >
      Add new workout
    </button>
  </div>
</div>
