<section
  class="flex h-full w-full min-w-0 flex-col gap-4 overflow-hidden"
  [attr.aria-label]="title()"
>
  <app-header
    class="sticky top-0 z-40 block w-full bg-[#F7F9FA] py-2 px-5"
    [config]="headerConfig()"
    (leftButtonClicked)="goBack()"
    (rightButtonClicked)="goNext()"
  />

  <div class="flex min-h-0 flex-1 flex-col gap-4">
    @if (step() === 'exercises') {
      <app-exercise-selection-step
        class="flex min-h-0 flex-1 flex-col"
        [config]="selectionConfig()"
        (dateSelected)="selectDate($event)"
        (queryChanged)="searchExercises($event)"
        (muscleToggled)="selectTargetMuscle($event)"
        (exerciseToggled)="toggleExercise($event)"
        (loadMoreRequested)="loadMoreExercises()"
      />
    } @else {
      <app-workout-planning-step
        [config]="planningConfig()"
        (planningChanged)="handlePlanningChanged($event)"
        (exerciseRemoved)="removeSelectedExercise($event)"
        (exerciseReordered)="reorderSelectedExercise($event)"
        (setCountChanged)="updateSelectedExerciseSetCount($event)"
      />

      <div class="stiky-button px-5">
        <app-button
          class="w-full"
          [config]="{ variant: 'fill', mode: 'form', type: 'button' }"
          (buttonClicked)="save()"
        >
          {{ saveButtonLabel() }}
        </app-button>
      </div>
    }
  </div>
</section>
