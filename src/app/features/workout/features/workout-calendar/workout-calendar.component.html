<section class="w-full bg-[#F7F9FA] py-6" aria-label="Workout calendar">
  <div class="flex w-full flex-col gap-4">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-lg font-bold text-[#202325]">{{ calendarTitle() }}</h2>
        <p class="text-xs font-medium text-[#72777A]">{{ weekRangeLabel() }}</p>
      </div>

      <button
        class="rounded-full bg-[#EBF4FF] px-3 py-1 text-xs font-medium text-[#0070F0]"
        type="button"
        (click)="selectToday()"
      >
        Today
      </button>
    </div>

    <div #calendarScrollContainer class="scrollbar-none -mx-6 overflow-x-auto px-6 py-2">
      <div class="flex w-max items-start gap-4 text-center">
        @for (day of calendarDays(); track day.date.toDateString()) {
          <button
            class="flex w-8 shrink-0 flex-col items-center gap-3 text-sm font-medium"
            type="button"
            [attr.aria-label]="'Select ' + day.date.toDateString()"
            [attr.aria-pressed]="isSelected(day.date)"
            (click)="selectDate(day.date)"
          >
            <span class="leading-5 text-[#0070F0]">{{ day.label }}</span>
            <span
              class="flex size-8 items-center justify-center rounded-lg leading-5 transition-colors"
              [class.bg-[#303437]]="isSelected(day.date)"
              [class.text-[#F2F4F5]]="isSelected(day.date)"
              [class.ring-2]="isToday(day.date) && !isSelected(day.date)"
              [class.ring-[#BFDDFF]]="isToday(day.date) && !isSelected(day.date)"
              [class.text-[#979C9E]]="!isSelected(day.date)"
            >
              {{ day.date.getDate() }}
            </span>
          </button>
        }
      </div>
    </div>
  </div>
</section>
