<section class="w-full bg-[#F7F9FA] px-6" [attr.aria-label]="i18n.t('selectedDayWorkouts')">
  <div class="flex w-full flex-col gap-4">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-lg font-bold text-[#202325]">{{ calendarTitle() }}</h2>
        <p class="text-xs font-medium text-[#72777A]">{{ weekRangeLabel() }}</p>
      </div>

      <button
        class="rounded-full bg-[#EBF4FF] px-3 py-1 text-xs font-medium text-[#0070F0]"
        type="button"
        (click)="selectToday()"
      >
        {{ i18n.t('today') }}
      </button>
    </div>

    <div #calendarScrollContainer class="scrollbar-none overflow-x-auto py-2">
      <div class="flex items-start gap-4 text-center">
        @for (day of calendarDays(); track day.date.toDateString()) {
          <button
            class="flex w-8 shrink-0 flex-col items-center gap-3 text-sm font-medium"
            type="button"
            [attr.aria-label]="i18n.t('select') + ' ' + day.date.toLocaleDateString(i18n.language() === 'fa' ? 'fa-IR' : undefined)"
            [attr.aria-selected]="isSelected(day.dateKey)"
            (click)="selectDate(day.dateKey)"
          >
            <span class="leading-5 text-[#0070F0]">{{ day.label }}</span>
            <span
              class="flex size-8 items-center justify-center rounded-lg leading-5 transition-colors"
              [class.bg-[#303437]]="isSelected(day.dateKey)"
              [class.text-[#F2F4F5]]="isSelected(day.dateKey)"
              [class.ring-2]="isToday(day.dateKey) && !isSelected(day.dateKey)"
              [class.ring-[#BFDDFF]]="isToday(day.dateKey) && !isSelected(day.dateKey)"
              [class.text-[#979C9E]]="!isSelected(day.dateKey)"
            >
              {{ day.date.getDate() }}
            </span>
          </button>
        }
      </div>
    </div>
  </div>
</section>
