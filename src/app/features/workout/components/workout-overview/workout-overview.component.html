<section [attr.aria-label]="config().title">
  <h2 class="text-lg font-bold text-[#202325]">{{ config().title }}</h2>

  <div class="mt-3 grid grid-cols-3 gap-3">
    @for (item of config().items; track item.label) {
      <article class="min-w-0 rounded-3xl bg-white p-4 shadow-sm">
        <span
          class="flex size-9 items-center justify-center rounded-full bg-[#EBF4FF] text-[#0070F0]"
        >
          @switch (item.icon) {
            @case ('calories') {
              <i class="app-icon fa-solid fa-fire size-5" aria-hidden="true"></i>
            }
            @case ('time') {
              <i class="app-icon fa-regular fa-clock size-5" aria-hidden="true"></i>
            }
            @case ('exercises') {
              <i class="app-icon fa-solid fa-dumbbell size-5" aria-hidden="true"></i>
            }
          }
        </span>
        <p class="mt-4 truncate text-base font-bold text-[#202325]">{{ item.value }}</p>
        <p class="mt-1 truncate text-xs text-[#72777A]">{{ item.label }}</p>
      </article>
    }
  </div>
</section>
