<section [attr.aria-label]="config().title">
  <h2 class="text-lg font-bold text-[#202325]">{{ config().title }}</h2>

  <div class="mt-3 grid grid-cols-3 gap-3">
    @for (item of config().items; track item.label) {
      <article class="min-w-0 rounded-3xl bg-white p-4 shadow-sm">
        <span
          class="flex size-9 items-center justify-center rounded-full bg-[#EBF4FF] text-[#0070F0]"
        >
          @switch (item.icon) {
            @case ('calories') {
              <svg class="size-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M13 3c1 4-2 5-2 8 0 1.4 1 2.5 2.4 2.5 2.2 0 3.6-2.3 2.8-4.8 2.4 1.8 3.8 4.2 3.8 6.7A8 8 0 1 1 7.6 8.8C7.8 12 9.2 13 10 13c-1.2-4.4.8-7.8 3-10Z"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linejoin="round"
                />
              </svg>
            }
            @case ('time') {
              <svg class="size-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="1.7" />
                <path
                  d="M12 9v4l2.5 1.5M9 3h6"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                />
              </svg>
            }
            @case ('exercises') {
              <svg class="size-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M7 8v8M4.5 10v4M17 8v8M19.5 10v4M7 12h10"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            }
          }
        </span>
        <p class="mt-4 truncate text-base font-bold text-[#202325]">{{ item.value }}</p>
        <p class="mt-1 truncate text-xs text-[#72777A]">{{ item.label }}</p>
      </article>
    }
  </div>
</section>
