<label class="block text-[#72777A]">
  {{ config().workoutTitleLabel }}
  <input
    class="mt-1 block w-full rounded-xl border border-[#E3E5E5] bg-[#F7F9FA] px-4 py-3 text-[#202325] focus:outline-none focus:ring-2 focus:ring-[#0070F0]"
    type="text"
    [placeholder]="config().defaultWorkoutTitle"
    [value]="config().workoutTitle ?? ''"
    (input)="onWorkoutTitleChanged($event)"
  />
  <span class="mt-1 block text-xs text-[#979C9E]">
    {{ config().leaveEmptyToUseLabel }} “{{ config().defaultWorkoutTitle }}”.
  </span>
</label>

<label class="block text-[#72777A]">
  {{ config().workingDayLabel }}
  <input
    class="mt-1 block w-full rounded-xl border border-[#E3E5E5] bg-[#F7F9FA] px-4 py-3 text-[#202325] focus:outline-none focus:ring-2 focus:ring-[#0070F0]"
    type="date"
    [value]="config().selectedDate"
    (input)="onSelectedDateChanged($event)"
  />
</label>

<label class="flex items-start gap-3 rounded-2xl border border-[#E3E5E5] bg-white p-4">
  <input
    class="mt-1 size-5 accent-[#0070F0]"
    type="checkbox"
    [checked]="config().isWeeklyPlan ?? false"
    (change)="onWeeklyPlanChanged($event)"
  />
  <span>
    <span class="block font-bold text-[#202325]">{{ config().weeklyPlanLabel }}</span>
    <span class="mt-1 block text-sm text-[#72777A]">{{ config().weeklyPlanHelpLabel }}</span>
  </span>
</label>

<div class="rounded-2xl bg-[#F7F9FA] p-3">
  <p class="text-sm font-semibold text-[#202325]">
    {{ config().selectedExercisesLabel }}: {{ config().exercises.length }}
  </p>
  <div class="mt-2 flex flex-col gap-2">
    @for (exercise of config().exercises; track exercise.id) {
      <div class="flex items-center justify-between gap-3 rounded-xl bg-white px-3 py-2">
        <span class="truncate text-sm font-medium text-[#202325]">{{ exercise.name }}</span>
        <span class="shrink-0 text-xs font-bold text-[#72777A]">
          {{ exercise.setCount }} {{ config().setsLabel ?? 'sets' }}
        </span>
      </div>
    }
  </div>
</div>
