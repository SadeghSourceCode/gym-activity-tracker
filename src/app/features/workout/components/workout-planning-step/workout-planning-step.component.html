<div class="flex flex-col gap-4">
  <label class="block text-[#72777A]">
    {{ config().workoutTitleLabel }}
    <input
      class="mt-1 block w-full rounded-xl border border-[#E3E5E5] bg-[#F7F9FA] px-4 py-3 text-[#202325] focus:outline-none focus:ring-2 focus:ring-[#0070F0]"
      type="text"
      [placeholder]="config().defaultWorkoutTitle"
      [value]="config().workoutTitle ?? ''"
      (input)="onWorkoutTitleChanged($event)"
    />
    <span class="mt-1 block text-xs text-[#979C9E]">
      {{ config().leaveEmptyToUseLabel }} “{{ config().defaultWorkoutTitle }}”.
    </span>
  </label>

  <label class="block text-[#72777A]">
    {{ config().weeklyPlanHelpLabel }}
    <select
      class="mt-1 block w-full rounded-xl border border-[#E3E5E5] bg-white px-4 py-3 text-[#202325] focus:outline-none focus:ring-2 focus:ring-[#0070F0]"
      [value]="config().recurrenceFrequency ?? 'none'"
      (change)="onRecurrenceChanged($event)"
    >
      <option value="none">{{ config().noRecurrenceLabel }}</option>
      <option value="weekly">{{ config().weeklyPlanLabel }}</option>
      <option value="monthly">{{ config().monthlyPlanLabel }}</option>
    </select>
  </label>

  <section>
    <p class="text-sm font-semibold text-[#202325]">
      {{ config().selectedExercisesLabel }}: {{ config().exercises.length }}
    </p>
    <div
      cdkDropList
      class="mt-2 flex flex-col gap-4"
      [cdkDropListData]="config().exercises"
      (cdkDropListDropped)="onExerciseDropped($event)"
    >
      @for (exercise of config().exercises; track exercise.id; let index = $index) {
        <article
          cdkDrag
          class="rounded-xl bg-white p-3 shadow-sm transition-shadow"
          [cdkDragData]="exercise.id"
        >
          <div class="flex items-center justify-between gap-2">
            <div class="flex min-w-0 items-center gap-2">
              <span
                cdkDragHandle
                class="cursor-grab text-[#979C9E] active:cursor-grabbing"
                [attr.aria-label]="config().reorderLabel"
                title="{{ config().reorderLabel }}"
              >
                <i class="app-icon fa-solid fa-grip-vertical" aria-hidden="true"></i>
              </span>
              <span class="min-w-0 truncate text-sm font-semibold text-[#202325]">
                {{ index + 1 }}. {{ exercise.name }}
              </span>
            </div>
            <button
              class="shrink-0 rounded-lg px-2 py-1 text-[#C93636]"
              type="button"
              (click)="exerciseRemoved.emit(exercise.id)"
            >
              {{ config().removeLabel }}
            </button>
          </div>

          <div class="mt-3 flex items-center justify-between gap-3">
            <button
              class="size-8 rounded-lg border border-[#E3E5E5] disabled:opacity-30"
              type="button"
              [disabled]="exercise.setCount <= 1"
              (click)="
                setCountChanged.emit({ exerciseId: exercise.id, setCount: exercise.setCount - 1 })
              "
            >
              <i class="app-icon fa-solid fa-minus" aria-hidden="true"></i>
            </button>
            <span class="text-sm font-bold text-[#202325]">
              {{ exercise.setCount }} {{ config().setsLabel ?? 'sets' }}
            </span>
            <button
              class="size-8 rounded-lg border border-[#E3E5E5]"
              type="button"
              (click)="
                setCountChanged.emit({ exerciseId: exercise.id, setCount: exercise.setCount + 1 })
              "
            >
              <i class="app-icon fa-solid fa-plus" aria-hidden="true"></i>
            </button>
          </div>
        </article>
      }
    </div>
  </section>
</div>
