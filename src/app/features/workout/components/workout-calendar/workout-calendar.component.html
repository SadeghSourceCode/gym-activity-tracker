<section class="w-full bg-[#F7F9FA]" [attr.aria-label]="i18n.t('selectedDayWorkouts')">
  <div class="flex w-full flex-col gap-4">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-lg font-bold text-[#202325]">{{ calendarTitle() }}</h2>
      </div>

      <app-button
        [config]="{
          size: 'small',
          variant: 'outline',
          mode: 'section',
          type: 'button',
          customClass: 'rounded-full bg-[#EBF4FF] px-3 py-1 text-xs font-medium text-[#0070F0]',
        }"
        (buttonClicked)="selectToday()"
      >
        {{ i18n.t('today') }}
      </app-button>
    </div>

    <div
      #calendarScrollContainer
      class="scrollbar-none overflow-x-auto py-2"
      [attr.dir]="i18n.language() === 'fa' ? 'rtl' : 'ltr'"
    >
      <div class="flex items-start gap-4 text-center">
        @for (day of calendarDays(); track day.dateKey) {
          <app-button
            [config]="{
              size: 'small',
              variant: 'link',
              mode: 'form',
              type: 'button',
              ariaLabel: i18n.t('select') + ' ' + day.accessibleDateLabel,
              customClass: 'flex w-8 shrink-0 flex-col items-center gap-3 text-sm font-medium',
            }"
            [attr.data-date-key]="day.dateKey"
            [attr.aria-selected]="isSelected(day.dateKey)"
            (buttonClicked)="selectDate(day.dateKey)"
          >
            <span class="leading-5 text-[#0070F0]">{{ day.label }}</span>
            <span
              class="flex size-8 items-center justify-center rounded-lg leading-5 transition-colors"
              [class.bg-[#303437]]="isSelected(day.dateKey)"
              [class.text-[#F2F4F5]]="isSelected(day.dateKey)"
              [class.ring-2]="isToday(day.dateKey) && !isSelected(day.dateKey)"
              [class.ring-[#BFDDFF]]="isToday(day.dateKey) && !isSelected(day.dateKey)"
              [class.text-[#979C9E]]="!isSelected(day.dateKey)"
            >
              {{ day.dayNumberLabel }}
            </span>
            <span
              class="size-1.5 shrink-0 rounded-full"
              [class.bg-[#0070F0]]="isWorkoutDay(day.dateKey)"
            ></span>
          </app-button>
        }
      </div>
    </div>
  </div>
</section>
