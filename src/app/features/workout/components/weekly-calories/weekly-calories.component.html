<section class="rounded-3xl bg-white p-5 shadow-sm" [attr.aria-label]="config().title">
  <header class="flex items-center justify-between gap-3">
    <h2 class="text-lg font-bold text-[#202325]">{{ config().title }}</h2>
    <span class="rounded-full bg-[#EBF4FF] px-4 py-2 text-xs font-semibold text-[#0070F0]">
      {{ config().periodLabel }}
    </span>
  </header>

  <div class="mt-6 flex h-40 items-end justify-between gap-3">
    @for (day of config().days; track day.dateKey) {
      <div class="flex h-full min-w-0 flex-1 flex-col items-center justify-end gap-2">
        <div
          class="relative flex h-full w-full max-w-8 items-end justify-center rounded-full bg-[#E9F6FF]"
        >
          @if (day.selected && day.calories) {
            <span
              class="absolute -top-4 z-10 rounded-lg bg-[#202325] px-2 py-1 text-xs font-semibold text-white shadow-lg"
            >
              {{ day.calories }}
            </span>
          }
          <span
            class="w-full rounded-full transition-[height] duration-300"
            [class.bg-[#0070F0]]="day.selected"
            [class.bg-[#28C76F]]="!day.selected"
            [style.height.%]="getBarHeight(day.calories)"
          ></span>
        </div>
        <span
          class="text-xs font-semibold"
          [class.text-[#0070F0]]="day.selected"
          [class.text-[#72777A]]="!day.selected"
        >
          {{ day.dayLabel }}
        </span>
      </div>
    }
  </div>

  <p class="mt-3 text-xs text-[#979C9E]">{{ config().caloriesUnit }}</p>
</section>
