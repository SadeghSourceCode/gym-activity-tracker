<div class="rounded-2xl border border-dashed border-[#C7CBCC] bg-[#F7F9FA] p-4 text-center">
  <h3 class="text-lg font-bold text-[#202325]">{{ config().title }}</h3>
  <p class="mt-1 text-sm text-[#72777A]">
    {{ config().message ?? '' }}
  </p>

  <div class="mt-4 grid gap-2 sm:grid-cols-2">
    <app-button
      class="rounded-full bg-[#0070F0] px-4 py-3 font-semibold text-white"
      [config]="{
        variant: 'fill',
        mode: 'section',
        type: 'button',
        ariaLabel: config().setWorkoutLabel,
      }"
      (buttonClicked)="setWorkout.emit()"
    >
      {{ config().setWorkoutLabel }}
    </app-button>

    <app-button
      class="rounded-full border border-[#0070F0] bg-white px-4 py-3 font-semibold text-[#0070F0]"
      [config]="{
        variant: 'outline',
        mode: 'section',
        type: 'button',
        ariaLabel: config().markAsRestDayLabel,
      }"
      (buttonClicked)="markAsRestDay.emit()"
    >
      {{ config().markAsRestDayLabel }}
    </app-button>
  </div>
</div>
