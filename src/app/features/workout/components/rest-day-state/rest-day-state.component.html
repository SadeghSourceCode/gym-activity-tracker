<div class="rounded-2xl border border-[#E3E5E5] bg-[#F7F9FA] p-4 text-center">
  <h3 class="text-lg font-bold text-[#202325]">{{ config().title }}</h3>
  <p class="mt-1 text-sm text-[#72777A]">
    {{ config().message ?? '' }}
  </p>

  <app-button
    [config]="{
      size: 'small',
      variant: 'outline',
      mode: 'section',
      type: 'button',
      ariaLabel: config().removeLabel,
    }"
    (buttonClicked)="remove.emit()"
  >
    {{ config().removeLabel }}
  </app-button>
</div>
