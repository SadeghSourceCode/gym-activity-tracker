<section class="rounded-3xl bg-white p-5 shadow-sm" [attr.aria-label]="config().title">
  <h2 class="text-lg font-bold text-[#202325]">{{ config().title }}</h2>

  <div class="mt-5 flex items-center gap-6 sm:flex-row sm:justify-between">
    <svg class="size-40 shrink-0 -rotate-90" viewBox="0 0 160 160" aria-hidden="true">
      @for (metric of config().metrics; track metric.label; let index = $index) {
        <circle
          cx="80"
          cy="80"
          [attr.r]="ringRadii[index]"
          fill="none"
          [attr.stroke]="metric.color"
          stroke-opacity="0.18"
          stroke-width="14"
        />
        <circle
          cx="80"
          cy="80"
          [attr.r]="ringRadii[index]"
          fill="none"
          [attr.stroke]="metric.color"
          stroke-linecap="round"
          stroke-width="14"
          [attr.stroke-dasharray]="getRingDashArray(index)"
        />
      }
    </svg>

    <ul class="grid min-w-0 flex-1 gap-4">
      @for (metric of config().metrics; track metric.label) {
        <li class="grid grid-cols-[12px_1fr] gap-3">
          <span class="mt-1 size-3 rounded-full" [style.background-color]="metric.color"></span>
          <span class="min-w-0">
            <span class="block text-sm font-semibold text-[#202325]">{{ metric.label }}</span>
            <span class="block truncate text-sm text-[#72777A]">{{ metric.valueLabel }}</span>
          </span>
        </li>
      }
    </ul>
  </div>
</section>
