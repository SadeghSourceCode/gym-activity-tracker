<button
  class="min-h-56 w-[86vw] max-w-96 shrink-0 snap-start overflow-hidden rounded-[28px] border border-[#E3E5E5] bg-white p-6 text-start transition hover:border-[#BFDDFF] focus:outline-none focus:ring-2 focus:ring-[#0070F0]"
  type="button"
  [attr.aria-label]="workout().scheduleLabel + ' · ' + workout().title"
  (click)="selected.emit(workout().id)"
>
  <span class="block text-2xl font-bold text-[#202325]">{{ workout().scheduleLabel }}</span>
  <span class="mt-1 block truncate text-sm font-semibold text-[#5B5F62]">{{
    workout().title
  }}</span>

  <span class="mt-5 grid gap-0">
    @for (exercise of workout().exercises; track exercise.id) {
      <span class="flex min-w-0 items-center gap-2 border-b border-[#E3E5E5] py-2 last:border-b-0">
        <span class="size-1.5 shrink-0 rounded-full bg-[#0070F0]"></span>
        <span class="truncate text-sm font-medium text-[#202325]">{{ exercise.name }}</span>
      </span>
    }
  </span>
</button>
