<section [attr.aria-label]="config().title" class="flex flex-col gap-4">
  <h2 class="text-xl font-bold text-[#404446]">{{ config().title }}</h2>

  @if (workouts().length) {
    <div class="scrollbar-none flex snap-x snap-mandatory gap-4 overflow-x-auto px-5 pb-3">
      @for (workout of workouts(); track workout.id) {
        <app-upcoming-workout-card
          [workout]="workout"
          (selected)="workoutSelected.emit({ workoutId: $event })"
        />
      }
    </div>
  } @else {
    <div class="flex w-full flex-col items-center rounded-[28px] bg-white p-8 text-center">
      <p class="text-[#72777A]">{{ config().emptyLabel }}</p>
    </div>
  }
</section>
