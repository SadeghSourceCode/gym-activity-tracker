<section [attr.aria-label]="config().title">
  <header class="flex items-center justify-between gap-4">
    <h2 class="text-xl font-bold text-[#404446]">{{ config().title }}</h2>
    <div class="flex rounded-full bg-[#F2F4F5] p-1" role="group">
      @for (period of config().periodOptions; track period.id) {
        <app-button
          [config]="{
            size: 'small',
            variant: 'link',
            mode: 'section',
            type: 'button',
            ariaLabel: period.label,
            ariaCurrent: config().selectedPeriod === period.id ? 'page' : null,
          }"
          (buttonClicked)="periodSelected.emit(period.id)"
        >
          <span
            class="rounded-full px-3 py-1.5 text-xs font-semibold transition-colors"
            [class.bg-white]="config().selectedPeriod === period.id"
            [class.text-[#0070F0]]="config().selectedPeriod === period.id"
            [class.text-[#72777A]]="config().selectedPeriod !== period.id"
            >{{ period.label }}</span
          >
        </app-button>
      }
    </div>
  </header>
  <div class="mt-5 rounded-3xl bg-white p-4">
    <svg
      class="h-40 w-full overflow-visible"
      viewBox="0 0 320 150"
      preserveAspectRatio="none"
      role="img"
      [attr.aria-label]="config().durationLabel"
    >
      <defs>
        <linearGradient id="activityFill" x1="0" y1="0" x2="0" y2="1">
          <stop stop-color="#78B7FF" stop-opacity=".35" />
          <stop offset="1" stop-color="#78B7FF" stop-opacity="0" />
        </linearGradient>
      </defs>
      <polyline
        [attr.points]="chartPoints() + ' 310,140 10,140'"
        fill="url(#activityFill)"
        stroke="none"
      />
      <polyline
        [attr.points]="chartPoints()"
        fill="none"
        stroke="#0070F0"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <div class="flex justify-between gap-1 overflow-hidden text-center text-xs">
      @for (point of config().points; track point.dateKey) {
        <span
          class="min-w-0 flex-1 truncate"
          [class.font-bold]="point.selected"
          [class.text-[#0070F0]]="point.selected"
          [class.text-[#72777A]]="!point.selected"
          >{{ point.label }}</span
        >
      }
    </div>
  </div>
</section>
