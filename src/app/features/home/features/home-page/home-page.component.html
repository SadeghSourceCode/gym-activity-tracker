<div class="mx-auto flex w-full max-w-xl flex-col gap-10 pb-4">
  <header class="flex items-center justify-between">
    <app-button
      [config]="{
        variant: 'outline',
        mode: 'iconOnly',
        type: 'button',
        ariaLabel: i18n.language() === 'fa' ? 'برنامه تمرین' : 'Workout planner',
      }"
      (buttonClicked)="openWorkoutPlanner()"
    >
      <span class="grid grid-cols-2 gap-1" aria-hidden="true">
        @for (_ of [1, 2, 3, 4]; track _) {
          <span class="size-2 rounded-sm border border-current"></span>
        }
      </span>
    </app-button>
    <div class="flex gap-3">
      <span
        class="flex size-12 items-center justify-center rounded-full border border-[#E3E5E5] bg-white text-xl text-[#72777A]"
        aria-hidden="true"
        >•••</span
      >
      <span
        class="relative flex size-12 items-center justify-center rounded-full border border-[#E3E5E5] bg-white text-xl text-[#72777A]"
        aria-hidden="true"
        >♧<span class="absolute right-2 top-2 size-1.5 rounded-full bg-[#FF7777]"></span
      ></span>
    </div>
  </header>

  <h1 class="text-3xl font-bold text-[#303437]">{{ i18n.t('home') }}</h1>
  <app-upcoming-workouts
    [config]="upcomingConfig()"
    (workoutSelected)="openWorkout($event.workoutId)"
    (addWorkoutRequested)="addWorkout()"
  />
  <app-nearby-gyms [config]="nearbyGymsConfig()" />
  <app-weekly-activity [config]="activityConfig()" />
</div>
