<div class="mx-auto flex w-full max-w-xl flex-col gap-5 pt-5 pb-24 px-5">
  @if (!hasWorkoutToday()) {
    <app-today-workout-empty-state
      [config]="todayWorkoutEmptyStateConfig()"
      (workoutAddRequested)="addWorkout()"
    />
  }

  <app-upcoming-workouts
    [config]="upcomingConfig()"
    (workoutSelected)="openWorkout($event.workoutId)"
  />
  <app-weekly-activity
    [config]="activityConfig()"
    (periodSelected)="selectActivityPeriod($event)"
  />

  <app-button
    class="fixed bottom-24 end-5 z-40"
    [config]="{
      variant: 'fill',
      mode: 'iconOnly',
      type: 'button',
      ariaLabel: i18n.t('addWorkout'),
    }"
    (buttonClicked)="addWorkout()"
  >
    <span class="flex size-14 items-center justify-center rounded-full">
      <i class="app-icon fa-solid fa-plus text-xl" aria-hidden="true"></i>
    </span>
  </app-button>
</div>
